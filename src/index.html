<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Caacupe+One&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>ScoredBoard</title>
</head>
<body>

<div class = "container"> 

        <div class = "home">
            
                <div class = "container-home">

                    <h1 class = "h1h" id = "h1hh">HOME</h1>
                    
                    <h1 class = "h1p" id = "homePoints">0</h1>

                    <button class = "btn-default" id = "pointsH1" >+1</button>

                    <button class = "btn-default" id = "pointsH2">+2</button>

                    <button class = "btn-default" id = "pointsH3">+3</button>

                </div>
        </div>

        
    

    <div class = "guest">

        <div class = "container-guest">

            <h1 class = "h1h" id = "h1g">GUEST</h1>
            <h1 class = "h1p" id = "guestPoints">0</h1>   
            <button class = "btn-default" id = "pointsG1">+1</button>
            <button class = "btn-default" id = "pointsG2">+2</button>
            <button class = "btn-default" id = "pointsG3">+3</button>  
                  
        </div>
    </div>
</div>   



</body>
</html>
